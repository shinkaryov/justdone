name: Deploy Terraform to GCP

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action: plan or apply"
        required: true
        default: "plan"
        type: choice
        options:
          - "plan"
          - "apply"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Authenticate to GCP
        run: echo "${{ secrets.SERVICE_ACCOUNT_KEY }}" > gcp-infra/service-account.json

      - name: Set project ID
        run: echo "project_id=${{ secrets.GCP_PROJECT_ID }}" >> gcp-infra/terraform.tfvars

      - name: Terraform Init
        run: terraform init
        working-directory: gcp-infra

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        run: terraform plan
        working-directory: gcp-infra

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve
        working-directory: gcp-infra
